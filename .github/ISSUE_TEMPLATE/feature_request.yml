name: Feature request
description: Suggest something Delta should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Delta to do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy
      description: Would this send anything off the PC, change or delete files, or act without asking? How should approvals work?
  - type: textarea
    id: more
    attributes:
      label: Anything else
