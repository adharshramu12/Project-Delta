name: ci
on: [push, pull_request]

# The token every job gets can only read the repo. A job that needs more asks for it itself.
permissions:
  contents: read

# Actions are pinned to a full commit SHA (a tag can be moved; a SHA cannot). The comment says which release
# it is; Dependabot proposes updates to both.
jobs:
  # Everything installed: every test runs.
  full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12 --extra all
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q

  # What a user gets from a plain `uv sync`: core must work, optional tests skip cleanly.
  minimal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -q
      - run: uv run --locked delta --version

  # Delta's browser tools in a real Chrome/Edge on a clean Windows PC, against a local static site.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DELTA_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -m e2e -v -rs tests/e2e

  # The eval suite (evals/tasks) with the scripted model: no keys, no network beyond 127.0.0.1, never a
  # paid API. Checks the harness, its checkers and Delta's agent loop on a clean Windows PC. Not a
  # required check; real-model runs are manual (`delta eval run --model <provider>`).
  evals-scripted:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked delta eval run --scripted --out evals-out --min-success 1.0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: evals-out/*.*
          if-no-files-found: ignore

  # Supply chain and static security checks. Not a required check: it reports, it does not block.
  # bandit: medium and high findings in src (justified exceptions carry a `# nosec <id>: reason`).
  # pip-audit: known vulnerabilities in the exact locked versions (uv.lock, Windows, every extra but dev).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: bandit
        run: uvx --python 3.12 bandit[toml]==1.8.6 -c pyproject.toml -r src -ll -q
      - name: pip-audit (locked dependencies)
        # The lock is for Windows (sys_platform == 'win32' markers); the markers are dropped so this Linux runner
        # audits every locked package instead of skipping them all.
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-dev --no-emit-project --extra all \
            | grep -E '^[A-Za-z0-9]' | sed 's/ *;.*$//' | sort -u > locked-requirements.txt
          uvx --python 3.12 pip-audit==2.9.0 --disable-pip --no-deps -r locked-requirements.txt --progress-spinner off
