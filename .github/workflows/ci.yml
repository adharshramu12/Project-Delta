name: ci
on: [push, pull_request]

# The token every job gets can only read the repo. A job that needs more asks for it itself.
permissions:
  contents: read

# Actions are pinned to a full commit SHA (a tag can be moved; a SHA cannot). The comment says which release
# it is; Dependabot proposes updates to both.
jobs:
  # Everything installed: every test runs.
  full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12 --extra all
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
      # How often Delta reads generated ERP-style captchas by itself (120 pictures, 3 styles): the captcha model,
      # Windows OCR on its own (what Delta used before the model) and both in Delta's order. The table goes to the
      # run's summary; the floors catch a regression, the targets are in docs/LOGINS.md.
      - name: captcha benchmark
        shell: pwsh
        run: |
          uv run --locked python -m delta.evals.captcha_bench --per-style 40 --out captcha-bench.md --min-combined 0.75 --min-three 0.9
          Get-Content captcha-bench.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      # The fat, rounded, hot-pink both-case captcha some college ERPs draw (style kl_bubbly, measured on its own;
      # first try and within three pictures, no vision call). Floors well under the measured rates, to catch a
      # regression, not to chase a number.
      - name: captcha benchmark (bright coloured, KL style)
        shell: pwsh
        run: |
          uv run --locked python -m delta.evals.captcha_bench --styles kl_bubbly --per-style 100 --out captcha-bench-kl.md --min-combined 0.3 --min-three 0.65
          Get-Content captcha-bench-kl.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captcha-bench
          path: captcha-bench*.md
          if-no-files-found: ignore

  # What a user gets from a plain `uv sync`: core must work, optional tests skip cleanly.
  minimal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -q
      - run: uv run --locked delta --version

  # Delta's browser tools in a real Chrome/Edge on a clean Windows PC, against a local static site.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DELTA_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -m e2e -v -rs tests/e2e

  # The one-command install a new user types (`irm .../install.ps1 | iex`), for real, against this commit, on clean
  # runners: Windows PowerShell 5.1 and PowerShell 7, Windows Server 2025 and 2022, and Windows 11 on ARM (x64
  # Python under emulation). Under the Restricted and AllSigned policies, into a normal profile folder and one
  # with spaces, an apostrophe and non-ASCII letters, then `delta --version`, `delta doctor`, the shortcuts, a
  # second run (update), and uninstall. Steps: tests/ci/install_oneliner.ps1.
  install-oneliner:
    name: install (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        shell: [powershell, pwsh]
        include:
          - os: windows-11-arm
            shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: one-liner, doctor, shortcuts, update, uninstall
        shell: pwsh
        env:
          DELTA_T_SHELL: ${{ matrix.shell }}
          # the commit being tested, from the repository it lives in (a pull request from a fork included)
          DELTA_T_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DELTA_T_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          $version = [regex]::Match((Get-Content pyproject.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          ./tests/ci/install_oneliner.ps1 -Shell $env:DELTA_T_SHELL -Ref $env:DELTA_T_REF -Repo $env:DELTA_T_REPO -Version $version
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-log-${{ matrix.os }}-${{ matrix.shell }}
          path: ${{ runner.temp }}/delta-install.log
          if-no-files-found: ignore

  # Everything a brand-new user does, on clean runners, against this commit: the README one-liner, a new
  # PowerShell (delta --version, delta doctor), Delta opened from its Desktop icon, every first-run dashboard page
  # and API, the first message with no AI model, onboarding, settings, a login, a schedule, a chat with a local
  # model (a stand-in for LM Studio: no keys), a task that opens Notepad, Stop, delta update, a restart,
  # crashes.log, Shut down, and uninstall with nothing left behind. Steps: tests/ci/fresh_user_journey.ps1.
  fresh-user-journey:
    name: fresh user (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install, use, update, uninstall as a new user
        shell: pwsh
        env:
          DELTA_T_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DELTA_T_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          $version = [regex]::Match((Get-Content pyproject.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          ./tests/ci/fresh_user_journey.ps1 -Ref $env:DELTA_T_REF -Repo $env:DELTA_T_REPO -Version $version
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-user-${{ matrix.os }}
          path: ${{ runner.temp }}/fresh-user
          if-no-files-found: ignore

  # The eval suite (evals/tasks) with the scripted model: no keys, no network beyond 127.0.0.1, never a
  # paid API. Checks the harness, its checkers and Delta's agent loop on a clean Windows PC. Not a
  # required check; real-model runs are manual (`delta eval run --model <provider>`).
  evals-scripted:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked delta eval run --scripted --out evals-out --min-success 1.0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: evals-out/*.*
          if-no-files-found: ignore

  # Supply chain and static security checks. Not a required check: it reports, it does not block.
  # bandit: medium and high findings in src (justified exceptions carry a `# nosec <id>: reason`).
  # pip-audit: known vulnerabilities in the exact locked versions (uv.lock, Windows, every extra but dev).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: bandit
        run: uvx --python 3.12 bandit[toml]==1.8.6 -c pyproject.toml -r src -ll -q
      - name: pip-audit (locked dependencies)
        # The lock is for Windows (sys_platform == 'win32' markers); the markers are dropped so this Linux runner
        # audits every locked package instead of skipping them all.
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-dev --no-emit-project --extra all \
            | grep -E '^[A-Za-z0-9]' | sed 's/ *;.*$//' | sort -u > locked-requirements.txt
          uvx --python 3.12 pip-audit==2.9.0 --disable-pip --no-deps -r locked-requirements.txt --progress-spinner off
