# Weekly update checks. Each update arrives as a pull request that runs the full CI.
version: 2
updates:
  # The pinned action SHAs in .github/workflows (the version comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python packages. Delta is managed with uv, so the "uv" ecosystem is used: it updates pyproject.toml and
  # uv.lock together (the plain "pip" ecosystem would leave uv.lock behind and `uv sync --locked` would fail).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
