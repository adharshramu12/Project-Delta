    publisher: Slack
    status: official
    description: Search and read messages, channels and users, and post messages in Slack.
    transport: http
    url: https://mcp.slack.com/mcp
    auth:
      type: oauth
      client: user
      client_secret: true
      label: >-
        Slack needs your own Slack app: create one at api.slack.com/apps, turn on its MCP server (Agents
