    url: https://gmailmcp.googleapis.com/mcp/v1
    auth:
      type: oauth
      client: user
      client_secret: true
      redirect_port: 8765
      label: >-
        Google's Workspace MCP servers are a Developer Preview: join the Google Workspace Developer Preview
