# Delta runtime configuration. Secrets (API keys, bot tokens) never go here:
# store them with `delta secrets set <name>` (Windows Credential Manager) or DELTA_<NAME> env vars.

agent:
  name: Delta
  owner_name: ""            # how Delta addresses you
  max_steps: 15             # tool calls per attempt
  max_attempts: 3           # verify -> retry cycles before reporting failure
  approval_timeout_s: 300   # unanswered approvals are denied

llm:
  providers:
    ollama:
      base_url: http://127.0.0.1:11434/v1
      local: true
      native_tools: false   # small Gemma models: Delta uses its JSON tool protocol instead
      keep_alive: 2m        # unload weights from VRAM after 2 idle minutes
      timeout_s: 180
      models:
        chat: gemma3n:e4b   # set to the tag you pulled, e.g. gemma4:e4b
        vision: gemma3:4b
    groq:
      base_url: https://api.groq.com/openai/v1
      secret: groq_api_key
      timeout_s: 60
      models:
        chat: openai/gpt-oss-120b     # strong tool use
        plan: openai/gpt-oss-120b
        verify: openai/gpt-oss-20b    # fast, cheap checks
    nim:
      base_url: https://integrate.api.nvidia.com/v1
      secret: nvidia_api_key
      timeout_s: 90
      models:
        chat: meta/llama-3.3-70b-instruct
        vision: meta/llama-3.2-90b-vision-instruct
  # Provider order per job. The first healthy, allowed provider wins.
  routes:
    chat: [ollama, groq, nim]
    plan: [groq, nim, ollama]
    verify: [groq, nim, ollama]
    vision: [ollama, nim]

search:
  order: [tavily, serpapi, duckduckgo]   # duckduckgo needs no key and is the free fallback
  max_results: 5

governor:
  sample_interval_s: 5
  below_normal_priority: true
  limits:
    gpu_temp_c: { throttle: 78, critical: 87 }
    cpu_temp_c: { throttle: 90, critical: 97 }
    vram_pct:   { throttle: 85, critical: 95 }
    ram_free_gb: { throttle: 1.0, critical: 0.4 }   # free RAM in GB (lower is worse)
    battery_pct_unplugged: { throttle: 30, critical: 15 }

memory:
  enabled: true
  auto_extract: true        # suggest facts after tasks; you can view/delete with /memory
  learn_skills: true        # turn verified tasks into reusable skills (see dashboard > Learned skills)
  recall_k: 6

files:
  # Where Delta saves files it makes for you. "auto" = Desktop\Delta, or, when OneDrive syncs the
  # Desktop, a local %USERPROFILE%\Delta folder (never synced) with a "Delta" shortcut on the Desktop.
  save_dir: auto

browser:
  # your-browser: use YOUR normal Chrome/Edge (signed in to your sites). Delta opens one window of
  #   its own there and drives it like a person (needs that window in front while typing).
  # delta-profile: a separate Delta profile, works in the background, but not signed in.
  mode: your-browser
  prefer: auto         # auto (your Windows default browser) | chrome | edge

addons:
  # Add-ons only run when listed here. Built-in: mcp. Community add-ons: pip packages
  # (entry point group "delta.addons") or folders in %LOCALAPPDATA%\Delta\addons\<name>\addon.py
  enabled: []
  config:
    mcp:
      servers: {}
      # Example (local server over stdio):
      #   filesystem:
      #     command: npx
      #     args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/you/Delta"]
      # Example (remote server over HTTP):
      #   github:
      #     url: https://your-mcp-server/mcp
      #     token_secret: github_mcp_token   # delta secrets set github_mcp_token
      #     risk: write                      # tools ask before running unless marked read-only

api:
  host: 127.0.0.1   # dashboard + desktop app; local only
  port: 7878

channels:
  cli: { enabled: true }
  # Telegram: get your numeric id from @userinfobot. Only these users can talk to Delta.
  telegram: { enabled: false, allowed_user_ids: [] }
  # Slack: member ids like U0123ABCD (profile -> ... -> Copy member ID). Socket Mode, no public URL.
  slack: { enabled: false, allowed_user_ids: [] }
