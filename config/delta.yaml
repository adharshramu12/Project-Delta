# Delta runtime configuration. Secrets (API keys, bot tokens) never go here:
# store them with `delta secrets set <name>` (Windows Credential Manager) or DELTA_<NAME> env vars.

agent:
  name: Delta
  owner_name: ""            # how Delta addresses you
  max_steps: 15             # tool calls per attempt
  max_attempts: 3           # verify -> retry cycles before reporting failure
  approval_timeout_s: 300   # unanswered approvals are denied
  token_budget: 0           # tokens one task may use before Delta pauses and asks; 0 = no limit

llm:
  providers:
    ollama:
      base_url: http://127.0.0.1:11434/v1
      local: true
      native_tools: false   # small Gemma models: Delta uses its JSON tool protocol instead
      keep_alive: 2m        # unload weights from VRAM after 2 idle minutes
      timeout_s: 180
      models:
        chat: gemma3n:e4b   # set to the tag you pulled, e.g. gemma4:e4b
        vision: gemma3:4b
    # LM Studio (or Jan / llama.cpp server: change base_url). Start its local server
    # (Developer tab, or `lms server start`); "auto" uses whatever chat model you downloaded.
    lmstudio:
      base_url: http://127.0.0.1:1234/v1   # used if LM Studio's own settings can't be read
      discover: lmstudio                   # follow the port set in LM Studio
      min_free_ram_gb: 6                   # don't load a model when the PC is short on memory
      local: true
      native_tools: false
      timeout_s: 180
      models:
        chat: auto
    # Your own Claude Pro/Max plan through the Claude Code CLI (run `claude` once to sign in).
    # Skipped automatically when Claude Code is not installed.
    claude_code:
      kind: claude_code
      timeout_s: 240
      # Per job: plan = once per task, chat = every step (most tokens), verify = one final check.
      # Change these in Settings > Connected apps.
      models:
        plan: sonnet
        chat: sonnet
        verify: haiku
        vision: haiku     # "what is on screen" and the screenshot check: fast and cheap
      efforts:
        plan: low         # plans are short checklists: low effort is ~2x faster and as good
        chat: low
        verify: low
        vision: low
    # Your own ChatGPT plan through the Codex CLI (run `codex` once to sign in).
    codex:
      kind: codex
      timeout_s: 240
      models:
        chat: ""          # empty = Codex's default model
    # Your Cline account, through the cline-cli that the Cline desktop app installs. Uses one of
    # Cline's FREE models by default (no credits needed); pick others in Settings > Connected apps.
    # Skipped when Cline is not installed.
    cline:
      kind: cline
      timeout_s: 240
      models:
        chat: reflection/beam-free   # Cline's free Beam model; "" = the model you last chose in Cline
    # DeepSeek's own API (very low cost). Key: `delta secrets set deepseek_api_key`.
    deepseek:
      base_url: https://api.deepseek.com/v1
      secret: deepseek_api_key
      timeout_s: 90
      models:
        chat: deepseek-chat
        plan: deepseek-chat
        verify: deepseek-chat
    groq:
      base_url: https://api.groq.com/openai/v1
      secret: groq_api_key
      timeout_s: 60
      models:
        chat: openai/gpt-oss-120b     # strong tool use
        plan: openai/gpt-oss-120b
        verify: openai/gpt-oss-20b    # fast, cheap checks
    nim:
      base_url: https://integrate.api.nvidia.com/v1
      secret: nvidia_api_key
      timeout_s: 90
      models:
        chat: meta/llama-3.3-70b-instruct
        vision: meta/llama-3.2-90b-vision-instruct
  # Provider order per job. The first healthy, allowed provider wins.
  routes:
    chat: [ollama, lmstudio, claude_code, codex, cline, deepseek, groq, nim]
    plan: [claude_code, codex, cline, deepseek, groq, nim, lmstudio, ollama]
    verify: [groq, nim, deepseek, claude_code, codex, cline, lmstudio, ollama]
    vision: [ollama, lmstudio, claude_code, codex, nim]

search:
  order: [tavily, serpapi, duckduckgo]   # duckduckgo needs no key and is the free fallback
  max_results: 5

governor:
  sample_interval_s: 5
  below_normal_priority: true
  limits:
    gpu_temp_c: { throttle: 78, critical: 87 }
    cpu_temp_c: { throttle: 90, critical: 97 }
    vram_pct:   { throttle: 85, critical: 95 }
    ram_free_gb: { throttle: 1.0, critical: 0.4 }   # free RAM in GB (lower is worse)
    battery_pct_unplugged: { throttle: 30, critical: 15 }

memory:
  enabled: true
  auto_extract: true        # suggest facts after tasks; you can view/delete with /memory
  learn_skills: true        # turn verified tasks into reusable skills (see dashboard > Learned skills)
  recall_k: 6
  max_items: 2000                 # facts you stated yourself are never removed by the limits
  max_item_chars: 500
  episode_retention_days: 90      # notes on past tasks
  untrusted_retention_days: 30    # notes from web pages, files or messages (data only, never rules)

learning:
  # Lessons from self-heal and repaired skill steps start as candidates and are used only after they prove
  # themselves. Anything from outside content is never promoted. See `delta learn`.
  enabled: true
  promote_after_runs: 3
  promote_on_eval: true
  demote_after_failures: 2
  repair_recipes: true
  lessons: true

grounding:
  # Before saying "done", match each claim in the answer (files, numbers, links, quotes, "I sent/saved")
  # against what the tools returned in this task. No AI tokens. report | strict | off
  mode: report
  max_checks: 1

files:
  # Where Delta saves files it makes for you. "auto" = Desktop\Delta, or, when OneDrive syncs the
  # Desktop, a local %USERPROFILE%\Delta folder (never synced) with a "Delta" shortcut on the Desktop.
  save_dir: auto

browser:
  # your-browser: use YOUR normal Chrome/Edge (signed in to your sites). Delta opens one window of
  #   its own there and drives it like a person (needs that window in front while typing).
  # delta-profile: a separate Delta profile, works in the background, but not signed in.
  mode: your-browser
  prefer: auto         # auto (your Windows default browser) | chrome | edge
  orange_cursor: true  # the mouse pointer turns orange while Delta controls the mouse/keyboard
  snapshot_diffs: true      # delta-profile: on the same page, send the AI only what changed
  full_snapshot_every: 8    # ...with a full page listing at least this often

# Durable task engine: task states and each step's log in tasks.db (secrets masked), crash resume with
# Resume / Discard (never automatic), and a watchdog that stops a hanging tool and every program it started.
engine:
  enabled: true
  retention_days: 30          # finished tasks older than this are removed
  max_mb: 50                  # tasks.db above this: the oldest finished tasks go first
  max_events_per_task: 2000
  default_tool_timeout_s: 600 # per tool call; 0 = no limit
  tool_timeouts: {}           # per tool, e.g. {web_search: 60, make_document: 900}

# Self-heal: when a step fails Delta works out why (element moved, slow page, banner in the way, browser
# died, AI busy...) and tries a fixed, safe fix first. Every retry passes the same policy and approvals.
# Steps that send, delete, buy, submit or run commands are never retried automatically. See SECURITY.md.
selfheal:
  enabled: true
  max_per_step: 2             # recovery attempts for one failed step
  max_per_task: 6             # recovery attempts in one task
  dismiss_benign_popups: true # close cookie banners / "not now" prompts that block a click (never accepts)
  strategy_after: 2           # failures before stepping down: page -> UI Automation -> screen -> ask you
  max_backoff_s: 30           # longest wait when the AI service is busy

# Opt-in, OFF by default: nothing here changes your providers or routes unless you fill it in.
router:
  ladder: []                  # cheaper models of your own providers, cheapest first, e.g. [ollama]
  escalate_after: 2           # failed steps before moving up the ladder
  cheap_steps: [observe]      # observe and/or act: which steps may start on the cheapest model
  fallbacks: []               # used only when every normal provider is rate limited, down or out of quota

# Undo for file changes: a copy of each file Delta changes inside your allowed folders, kept for a while.
# Restore with `delta undo <task id>`, the dashboard, or Telegram /undo (needs your PIN).
undo:
  enabled: true
  max_file_mb: 25             # bigger files are not copied (the timeline says so)
  max_task_mb: 200
  retention_days: 7

# How Delta sees. Pictures stay on this PC, except that a picture goes to the vision model you chose.
perception:
  marks: true                 # numbered boxes on clickable elements; Delta clicks the chosen one by its handle
  max_marks: 40               # marks per picture
  max_side: 1280              # longest side of a marked picture (pixels): smaller = fewer image tokens
  jpeg_quality: 60
  ocr: auto                   # Windows' built-in OCR for apps with no accessibility tree | off
  cache: true                 # do not send an unchanged screen or window again

# Parallel read-only helpers: OFF by default (it adds a few lines to every planner request). When on, the
# planner may split independent lookups between helpers that can only search, read pages and read files in
# your allowed folders. They can never click, type, write, send or use your own browser.
helpers:
  enabled: false
  max_helpers: 2              # 1 to 4 at the same time
  token_budget: 6000          # per helper
  timeout_s: 60               # per helper
  max_steps: 4                # model calls per helper
  read_page: true             # read pages in a fresh headless browser context (no cookies, no sign-ins)

# Writer and Documents: write_post, prepare_post (Delta never presses Post), make_document.
writer:
  enabled: true
  output_dir: auto          # auto = your Documents\Delta folder, or any absolute path
  page_size: A4             # A4 | Letter
  latex: auto               # auto = use tectonic/xelatex/pdflatex only if already installed | off
  pdf_browser: ""           # "" = the Edge/Chrome already on this PC
  voice_file: ""            # your past posts to copy your voice ("" = <output_dir>\my-posts.txt if present)
  substack_publication: ""  # e.g. yourname -> opens yourname.substack.com/publish/post

# Simple image captchas on YOUR OWN accounts (e.g. your university portal). Off by default: every
# captcha is handed to you. Listed hosts are read by the vision model (2 tries, then you are asked).
# Exact host match; "*.example.in" also covers its subdomains. Add with `delta captcha allow <host>`.
# reCAPTCHA, hCaptcha and Cloudflare Turnstile are always refused. See SECURITY.md.
captcha:
  allowed_sites: []

addons:
  # Add-ons only run when listed here. Built-in: mcp. Community add-ons: pip packages
  # (entry point group "delta.addons") or folders in %LOCALAPPDATA%\Delta\addons\<name>\addon.py
  enabled: []
  config:
    mcp:
      servers: {}
      # Example (local server over stdio):
      #   filesystem:
      #     command: npx
      #     args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/you/Delta"]
      # Example (remote server over HTTP):
      #   github:
      #     url: https://your-mcp-server/mcp
      #     token_secret: github_mcp_token   # delta secrets set github_mcp_token
      #     risk: write                      # tools ask before running unless marked read-only

api:
  host: 127.0.0.1   # dashboard + desktop app; local only
  port: 7878

channels:
  cli: { enabled: true }
  # Telegram: get your numeric id from @userinfobot. Only these users can talk to Delta.
  telegram: { enabled: false, allowed_user_ids: [] }
  # Slack: member ids like U0123ABCD (profile -> ... -> Copy member ID). Socket Mode, no public URL.
  slack: { enabled: false, allowed_user_ids: [] }
