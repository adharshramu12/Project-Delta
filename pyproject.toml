[project]
name = "delta-agent"
version = "0.4.1"
description = "Project Delta by Adharsh Kumar Bachu: a personal, local-first, OS-level AI agent with human approval and verified task execution."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Adharsh Kumar Bachu" }]
maintainers = [{ name = "Adharsh Kumar Bachu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai agent", "personal ai assistant", "windows ai agent", "local-first ai", "computer use", "telegram bot", "deep research", "mcp", "llm", "automation"]
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "keyring>=25.0",
    "psutil>=6.0",
    "nvidia-ml-py>=12.560",
    "send2trash>=1.8",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    # dashboard + local API: the main way people use Delta, so part of every install
    # (imported only when `delta run` starts, so the CLI stays light)
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    # using the computer: browser (drives the installed Chrome/Edge, no browser download),
    # mouse, keyboard and screen. Core abilities, so part of every install; all load on first use.
    "playwright>=1.48",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pillow>=10.4",
    # system controls from the phone: exact volume (Windows Core Audio) and one webcam photo
    "pycaw>=20240316; sys_platform == 'win32'",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
channels = ["python-telegram-bot>=21.6", "slack-bolt>=1.21", "aiohttp>=3.10"]
voice = ["faster-whisper>=1.1", "piper-tts>=1.2", "openwakeword>=0.6", "sounddevice>=0.5"]
mcp = ["mcp>=2.0"]
# reading simple text captchas on saved logins: a small offline model made for them (MIT, ONNX on the CPU).
# Part of the installer's `--extra all`; Delta falls back to Windows OCR when it is missing.
captcha = ["ddddocr>=1.6.1,<1.7", "onnxruntime>=1.20"]
all = ["delta-agent[channels,mcp,captcha]"]

[project.scripts]
delta = "delta.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "types-pyyaml", "types-psutil"]

[tool.uv]
# Delta targets Windows first; Linux/macOS support is a roadmap item.
environments = ["sys_platform == 'win32'"]
# ddddocr asks for the full opencv-python on Windows; Delta already ships opencv-python-headless (the same cv2,
# without the GUI parts). Both at once would overwrite each other's files, so the full one is never installed.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: real-browser end-to-end tests; skipped unless DELTA_E2E=1 (run: DELTA_E2E=1 pytest -m e2e)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# ASYNC240: stat()/exists() on local paths is microseconds; offloading them would only add noise.
ignore = ["RUF001", "ASYNC240"]

[tool.bandit]
# Checked in CI (job `security`, medium and high only). Reviewed and skipped project-wide:
# B608: SQL text is built only from constant column lists and "?" placeholders; every value is a bound parameter.
# B104: the only hit compares a server's reported address with "0.0.0.0"; Delta never binds to it (config.py
#       forces the API onto loopback).
skips = ["B608", "B104"]

[tool.mypy]
python_version = "3.12"
packages = ["delta"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
