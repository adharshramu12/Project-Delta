<!doctype html>
<html><head><meta charset="utf-8"><title>Actions</title>
<style>
  #menu .sub { display: none; } #menu:hover .sub { display: block; }
  #feed { height: 120px; overflow-y: auto; border: 1px solid #999; }
  #feed div { height: 30px; }
</style></head>
<body>
<h1>Actions</h1>
<label>Semester <select id="sem"><option value="">Choose</option><option value="5">Fifth</option>
  <option value="7">Seventh</option></select></label>
<label><input type="checkbox" id="agree"> I agree</label>
<label>Attachment <input type="file" id="file"></label>
<div id="menu"><button>Reports</button><div class="sub"><a href="#" id="att">Attendance</a></div></div>
<button id="later" onclick="setTimeout(() => { document.getElementById('status').textContent = 'Loaded'; }, 700)">
  Load later</button>
<p id="status">Loading</p>
<a href="results.html" target="_blank">Open results in a new tab</a>
<button id="del" onclick="document.getElementById('out').textContent = confirm('Delete the draft?') ? 'deleted' : 'kept'">
  Remove draft</button>
<p id="out"></p>
<iframe id="inner" title="Inner" srcdoc="<button onclick=&quot;this.textContent='Pressed'&quot;>Press me</button>"></iframe>
<div id="feed"></div>
<script>
  const feed = document.getElementById('feed');
  let n = 0;
  const more = () => { for (let i = 0; i < 5 && n < 20; i++) { const d = document.createElement('div'); d.setAttribute('role', 'option'); d.textContent = 'Row ' + (++n); feed.appendChild(d); } };
  more();
  feed.addEventListener('scroll', () => { if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 5) setTimeout(more, 200); });
</script>
</body></html>
